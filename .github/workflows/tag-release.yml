name: Tag release on merge
# Makes the tag a product of merging the release PR, so it always lands on the merge
# commit on main. Fires when CHANGELOG.md changes on main; if the newest released
# heading has no tag yet, creates an annotated tag whose message is that section.
#
# A tag pushed with GITHUB_TOKEN does not trigger other workflows, so this pushes with
# RELEASE_TAG_TOKEN (a fine-grained PAT with contents:write on this repo) when set.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_TAG_TOKEN || github.token }}
      - name: Tag the newest released CHANGELOG entry
        env:
          HAVE_PAT: ${{ secrets.RELEASE_TAG_TOKEN != '' }}
        run: |
          set -euo pipefail
          version=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)
          [ -z "$version" ] && { echo "No released version in CHANGELOG.md."; exit 0; }
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists."; exit 0
          fi
          code=$(sed -nE 's/^__version__ = "([^"]+)"/\1/p' robert/__init__.py)
          if [ "$code" != "$version" ]; then
            echo "::error::CHANGELOG says ${version} but robert/__init__.py says ${code}"; exit 1
          fi
          notes=$(bash .github/scripts/changelog-section.sh "${version}" CHANGELOG.md)
          if [ "${HAVE_PAT}" != "true" ]; then
            echo "::warning::RELEASE_TAG_TOKEN is not set: ${tag} will not trigger release.yml;"
            echo "::warning::re-push the tag with a PAT to publish it."
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}" -m "${notes}"
          git push origin "refs/tags/${tag}"
