name: pages
# Publishes the GitHub Pages site (https://umbralcalc.github.io/robert/), built by
# docs/build.sh from README.md, cloud/README.md and CHANGELOG.md. Nothing generated
# is committed: every push to main that touches a page rebuilds it. Pull requests
# build the site too, so a broken page fails before merge, but only main deploys.
on:
  push:
    branches: [main]
    paths:
      - README.md
      - cloud/README.md
      - CHANGELOG.md
      - assets/**
      - docs/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - cloud/README.md
      - CHANGELOG.md
      - assets/**
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pandoc
      - run: sh docs/build.sh _site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
