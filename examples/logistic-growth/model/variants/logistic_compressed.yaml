# v2 (compress): the seasonal nuisance removed; the claim should not move.
main:
  partitions:
  - name: population
    params: {r: [0.3], capacity: [100.0], noise: [0.01]}
    init_state_values: [5.0]
    state_history_depth: 1
    seed: 3
  expressions:
  - partition: population
    fields: [{name: x}]
    outputs: ["max(x + r * (1 - x / capacity) * x * dt + noise * x * shared(normal(0, 1)), 0.1)"]
  simulation:
    termination_condition: {type: number_of_steps, max_steps: 39}
    timestep_function: {type: constant, stepsize: 1.0}
    init_time_value: 0.0
outputs:
- {name: model, function: {type: json_log, path: out/model.log}}
