[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robert"
version = "0.1.0"
description = "The AI simulation scientist: a method CLI and MCP server that drives stochadex projects through the discovery-and-warrant loop."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
arrow = ["pyarrow>=15"]
dev = ["pytest>=8"]

[project.scripts]
robert = "robert.cli:main"

[tool.setuptools.packages.find]
include = ["robert*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
