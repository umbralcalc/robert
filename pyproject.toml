[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
# `robert` is taken on PyPI; the command is still `robert`.
name = "robert-ai"
dynamic = ["version"]
description = "The AI simulation scientist: a method CLI and MCP server that drives stochadex projects through the discovery-and-warrant loop."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "umbralcalc", email = "umbralcalc@gmail.com" }]
keywords = ["simulation", "stochadex", "scientific-method", "mcp", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Environment :: Console",
]
dependencies = [
    "pyyaml>=6",
    "mcp>=2.3,<3",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
arrow = ["pyarrow>=15"]
cloud = ["anthropic>=2.3"]
dev = ["pytest>=8", "build>=1.2", "anthropic>=2.3"]

[project.urls]
Homepage = "https://github.com/umbralcalc/robert"
Changelog = "https://github.com/umbralcalc/robert/blob/main/CHANGELOG.md"

[project.scripts]
robert = "robert.cli:main"

[tool.setuptools.dynamic]
version = { attr = "robert.__version__" }

[tool.setuptools.packages.find]
include = ["robert*"]

[tool.setuptools.package-data]
robert = ["stochadex.json", "cloud/instructions.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
