<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="robert: the AI simulation scientist, built on stochadex">
  <title>$if(is-home)$robert: the AI simulation scientist$else$$pagetitle$ · robert$endif$</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #1c4587;
      --accent-soft: #e8eef8;
      --text: #1e293b;
      --text-muted: #64748b;
      --bg: #ffffff;
      --bg-code: #f6f8fb;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --accent: #8fb0e8;
        --accent-soft: #1b2638;
        --text: #e2e8f0;
        --text-muted: #94a3b8;
        --bg: #0f141c;
        --bg-code: #161d28;
        --border: #263142;
      }
    }
    :root[data-theme="dark"] {
      --accent: #8fb0e8;
      --accent-soft: #1b2638;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --bg: #0f141c;
      --bg-code: #161d28;
      --border: #263142;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      line-height: 1.65;
      color: var(--text);
      background: var(--bg);
    }

    header.site {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    header.site nav {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0.75rem 16px;
      display: flex;
      gap: 1.25rem;
      align-items: center;
      flex-wrap: wrap;
    }
    header.site .brand { font-weight: 700; font-size: 1.1rem; color: var(--text); margin-right: auto; }
    header.site a { color: var(--text-muted); text-decoration: none; font-weight: 500; }
    header.site a:hover, header.site a.current { color: var(--accent); }

    .layout {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem 16px 4rem;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 3rem;
    }
    .layout.no-toc { grid-template-columns: minmax(0, 1fr); max-width: 860px; }
    main { min-width: 0; }

    nav#TOC {
      position: sticky;
      top: 4.5rem;
      align-self: start;
      font-size: 0.875rem;
      max-height: calc(100vh - 6rem);
      overflow-y: auto;
    }
    nav#TOC::before {
      content: "On this page";
      display: block;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    nav#TOC ul { list-style: none; margin: 0; padding: 0; }
    nav#TOC ul ul { padding-left: 0.9rem; }
    nav#TOC li { margin: 0.3rem 0; }
    nav#TOC a { color: var(--text-muted); text-decoration: none; }
    nav#TOC a:hover { color: var(--accent); }

    h1, h2, h3, h4 { line-height: 1.3; scroll-margin-top: 4.5rem; }
    h1 { font-size: 2rem; margin-top: 0; }
    h2 { font-size: 1.5rem; margin-top: 2.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
    h3 { font-size: 1.2rem; margin-top: 2rem; }
    a { color: var(--accent); }
    img { max-width: 100%; height: auto; }

    code {
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.875em;
      background: var(--bg-code);
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    pre {
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      line-height: 1.5;
    }
    pre code { background: none; padding: 0; font-size: 0.85rem; }
    pre.mermaid { background: none; border: none; text-align: center; }

    .table-scroll { overflow-x: auto; margin: 1rem 0; }
    table { border-collapse: collapse; width: 100%; font-size: 0.925rem; }
    th, td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; vertical-align: top; }
    th { background: var(--accent-soft); font-weight: 600; }

    footer.site {
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.875rem;
      text-align: center;
      padding: 1.5rem 16px;
    }
    footer.site a { color: var(--text-muted); }

    @media (max-width: 860px) {
      .layout { grid-template-columns: minmax(0, 1fr); }
      nav#TOC { display: none; }
    }
  </style>
</head>
<body>
  <header class="site">
    <nav>
      <a class="brand" href="index.html">robert</a>
      <a href="index.html"$if(is-home)$ class="current"$endif$>Home</a>
      <a href="cloud.html"$if(is-cloud)$ class="current"$endif$>In the cloud</a>
      <a href="changelog.html"$if(is-changelog)$ class="current"$endif$>Changelog</a>
      <a href="https://github.com/umbralcalc/stochadex">stochadex</a>
      <a href="https://github.com/umbralcalc/robert">GitHub</a>
    </nav>
  </header>
  <div class="layout$if(toc)$$else$ no-toc$endif$">
    <main>
$body$
    </main>
$if(toc)$
    $table-of-contents$
$endif$
  </div>
  <footer class="site">
    robert is MIT licensed · <a href="https://github.com/umbralcalc/robert">source on GitHub</a>
  </footer>
  <script type="module">
    if (document.querySelector("pre.mermaid")) {
      const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
      const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      mermaid.initialize({ startOnLoad: false, theme: dark ? "dark" : "neutral" });
      await mermaid.run({ querySelector: "pre.mermaid" });
    }
  </script>
</body>
</html>
